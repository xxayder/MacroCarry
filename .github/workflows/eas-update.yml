name: EAS Update

on:
  push:
    branches:
      - main

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update to production channel
        run: |
          eas update \
            --branch production \
            --platform android \
            --environment production \
            --message "CI: ${{ github.event.head_commit.message }}" \
            --non-interactive
        env:
          EAS_NO_VCS: 1
